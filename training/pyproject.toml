[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opc"
version = "0.1.0"
description = "Overlap-component percolation study for level-1 phylogenetic network inference"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",       # np.bitwise_count
    "scipy>=1.11",
    "pandas>=2.2",
    "pyarrow>=15",
    "matplotlib>=3.8",
    "dendropy>=5.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6", "msprime>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 99
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
